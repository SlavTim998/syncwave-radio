<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#513cda"><title>SyncWave</title><link rel="stylesheet" href="/style.css"></head>
<body>
<div class="background" aria-hidden="true"><div class="blob blob1"></div><div class="blob blob2"></div><div class="blob blob3"></div><div class="grain"></div></div>
<header><a class="logo" href="/">syncwave<span>●</span></a><button id="adminToggle" class="admin-icon" title="Админка" aria-label="Админка">⚙</button></header>
<main class="stage"><div class="orb" id="orb" aria-hidden="true"><div class="orb-inner"><span>♫</span></div></div><div class="track-info"><div class="tiny-label">СЕЙЧАС ИГРАЕТ</div><h1 id="song">Загрузка...</h1><div id="status" class="status">Подключение...</div></div><div class="actions"><button id="listen" class="listen">▶</button><button id="mute" class="mute" hidden aria-label="Выключить звук">♪</button></div><div class="progress"><div id="bar"></div></div><div id="hint" class="hint">Нажми ▶, чтобы слушать</div></main>
<div id="overlay" class="overlay hidden"><section class="modal" role="dialog" aria-modal="true" aria-label="Админка"><button id="close" class="close" aria-label="Закрыть">×</button><h2>Админ</h2><div id="loginView"><form id="loginForm"><input id="password" type="password" autocomplete="current-password" placeholder="Пароль" aria-label="Пароль" required><button class="full primary">Войти</button></form></div><div id="dashView" hidden><div class="online"><span>Онлайн</span><strong id="listeners">0</strong></div><button id="random" class="full primary">⤨ Случайный трек</button><div id="trackList" class="tracklist"></div><form id="urlForm" class="stack"><input id="trackTitle" placeholder="Название" aria-label="Название трека" required maxlength="90"><input id="trackUrl" type="url" placeholder="Ссылка на аудио (HTTPS)" aria-label="Прямая HTTPS-ссылка на аудиофайл" required><button class="full">+ Ссылка</button></form><form id="uploadForm" class="stack"><input id="audioFile" type="file" accept=".mp3,.ogg,.wav,.m4a,.webm,audio/*" aria-label="Выбрать аудиофайл" required><button class="full">↑ Загрузить файл</button></form><button id="logout" class="logout">Выйти</button></div><div id="message" class="message" role="status"></div></section></div>
<audio id="audio" preload="auto" loop crossorigin="anonymous"></audio><script src="/socket.io/socket.io.js"></script><script src="/app.js"></script>
</body></html>
